# extlinux configuration - read by the syslinux bootloader stage
# installed in the MBR/boot sector. Selects the kernel and passes
# the initial kernel command line.
DEFAULT osukiosk
# TEMPORARY, Stage 5 on-hardware testing (see PROGRESS.md): always show
# the "boot:" prompt, so extra kernel parameters such as "osukiosk.hold"
# or "rdinit=/bin/sh" can be typed after the label. With PROMPT 0 it
# only appears while Shift is held, and holding Shift did not bring it
# up on the Lenovo Z570. TIMEOUT is in tenths of a second; any key
# typed at the prompt stops the countdown.
PROMPT 1
TIMEOUT 30

LABEL osukiosk
    KERNEL /bzImage
    APPEND console=tty1
