# extlinux configuration - read by the syslinux bootloader stage
# installed in the MBR/boot sector. Selects the kernel and passes
# the initial kernel command line.
#
# The boot: prompt shows on every boot for 1 s (TIMEOUT is in tenths of
# a second) and the first key typed there stops the countdown. With
# PROMPT 0 it would appear only while Shift is held, which did not work
# on the Lenovo Z570. Labels to type at the prompt:
#   debug  diagnostic mode: root shell on tty2 (Ctrl+Alt+F2), VT
#          switching inside cage, kernel messages on screen
#   hold   like debug, but the session does not start cage at all
# Kernel parameters typed after a label are appended to its APPEND line,
# e.g. "osukiosk cpufreq.default_governor=schedutil".
# This file sits on the FAT boot partition, so it can also be edited on
# the stick itself, e.g. "DEFAULT debug" while working on the game.
DEFAULT osukiosk
PROMPT 1
TIMEOUT 10

LABEL osukiosk
    KERNEL /bzImage
    APPEND console=tty1 quiet

LABEL debug
    KERNEL /bzImage
    APPEND console=tty1 osukiosk.debug

LABEL hold
    KERNEL /bzImage
    APPEND console=tty1 osukiosk.hold
