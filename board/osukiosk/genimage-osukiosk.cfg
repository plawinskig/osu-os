image osukiosk.img {
    hdimage {
        # MBR (msdos) partition table - simpler and more broadly
        # compatible with legacy BIOS boot than GPT for this stage.
        partition-table-type = "mbr"
        # Partitions start on 1 MiB boundaries, the alignment partitioning
        # tools use, so that writes line up with flash erase blocks.
        align = 1M
    }

    partition boot {
        partition-type = 0xC          # FAT32 LBA, as made by mkdosfs below
        bootable = "true"
        image = "boot.vfat"
        # The kernel and the system image (which includes the game) with
        # room to grow: as long as this layout stays, a flashed stick is
        # updated by replacing bzImage and rootfs.squashfs on this
        # partition, without the full dd that wipes the data partition.
        size = 1G
    }

    partition data {
        partition-type = 0x83         # generic Linux data
        image = "data.img"            # pre-built F2FS raw image
    }
}

image boot.vfat {
    vfat {
        label = "OSUBOOT"
        # FAT32 explicitly: mkdosfs picks the FAT type from the size on its
        # own, and it made the old 256 MB partition FAT16 behind the FAT32
        # partition type above.
        extraargs = "-F 32"
        files = {
            "bzImage",
            "rootfs.squashfs",
            "extlinux.conf"
        }
    }
    size = 1G
}
